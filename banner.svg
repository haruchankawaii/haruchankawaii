    height="45"
    fill="#ffffff"
    opacity="0.035">

    <animate
      attributeName="y"
      values="-40;600"
      dur="3.5s"
      repeatCount="indefinite"/>
  </rect>


  <!-- CRT SCANLINES -->
  <rect
    width="1200"
    height="560"
    fill="url(#scanlines)"
