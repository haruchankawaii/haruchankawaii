      M0 60H1200 M0 120H1200 M0 180H1200
      M0 240H1200 M0 300H1200 M0 360H1200
      M0 420H1200 M0 480H1200
    " stroke="#ffffff" stroke-width="1"/>

    <path d="
      M100 0V560 M200 0V560 M300 0V560
      M400 0V560 M500 0V560 M600 0V560
      M700 0V560 M800 0V560 M900 0V560
      M1000 0V560 M1100 0V560
    " stroke="#ffffff" stroke-width="1"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 60;0 0"
      dur="6s"
      repeatCount="indefinite"/>
  </g>


