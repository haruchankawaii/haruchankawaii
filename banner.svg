    <text x="265" y="370" xml:space="preserve">
      <tspan x="265" dy="0">██╗  ██╗ █████╗ ██╗    ██╗ █████╗ ██╗██╗</tspan>
      <tspan x="265" dy="32">██║ ██╔╝██╔══██╗██║    ██║██╔══██╗██║██║</tspan>
      <tspan x="265" dy="32">█████╔╝ ███████║██║ █╗ ██║███████║██║██║</tspan>
      <tspan x="265" dy="32">██╔═██╗ ██╔══██║██║███╗██║██╔══██║██║██║</tspan>
