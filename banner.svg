<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="720"
  viewBox="0 0 1400 720"
>
  <defs>
    <!-- WHITE GLOW -->
    <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- RED GLOW -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- NOISE -->
    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="3"
        seed="8"
      >
        <animate
          attributeName="seed"
          values="1;5;10;3;8;2"
          dur="0.35s"
          repeatCount="indefinite"
        />
      </feTurbulence>

      <feColorMatrix type="saturate" values="0" />

      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
    </filter>

    <!-- SCANLINES -->
    <pattern
      id="scanlines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse"
    >
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- GRID -->
    <pattern
      id="grid"
      width="50"
      height="50"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 50 0 L 0 0 0 50"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        opacity="0.045"
      />
    </pattern>

    <!-- SOFT LINE -->
    <linearGradient id="softLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- RED SCANNER -->
    <linearGradient id="redScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff003c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1400" height="720" fill="#030303"/>

  <!-- MOVING GRID -->
  <rect width="1400" height="720" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 50 50"
      dur="10s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- AMBIENT RED PULSE -->
  <circle
    cx="700"
    cy="350"
    r="330"
    fill="#ff003c"
    opacity="0.02"
    filter="url(#redGlow)"
  >
    <animate
      attributeName="r"
      values="280;360;280"
      dur="5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.008;0.03;0.008"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- TOP SOFT LINE -->
  <rect
    x="180"
    y="110"
    width="1040"
    height="1.5"
    fill="url(#softLine)"
    opacity="0.35"
  >
    <animate
      attributeName="opacity"
      values="0.15;0.4;0.15"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- HARU RED GLITCH SHADOW -->
  <g
    font-family="monospace"
    font-size="27"
    font-weight="900"
    fill="#ff003c"
    opacity="0"
    filter="url(#redGlow)"
  >
    <text
      x="700"
      y="190"
      text-anchor="middle"
      xml:space="preserve"
    >
      <tspan x="700" dy="0">██╗  ██╗ █████╗ ██████╗ ██╗   ██╗       ██████╗██╗  ██╗ █████╗ ███╗   ██╗</tspan>
      <tspan x="700" dy="34">██║  ██║██╔══██╗██╔══██╗██║   ██║      ██╔════╝██║  ██║██╔══██╗████╗  ██║</tspan>
      <tspan x="700" dy="34">███████║███████║██████╔╝██║   ██║█████╗██║     ███████║███████║██╔██╗ ██║</tspan>
      <tspan x="700" dy="34">██╔══██║██╔══██║██╔══██╗██║   ██║╚════╝██║     ██╔══██║██╔══██║██║╚██╗██║</tspan>
      <tspan x="700" dy="34">██║  ██║██║  ██║██║  ██║╚██████╔╝      ╚██████╗██║  ██║██║  ██║██║ ╚████║</tspan>
      <tspan x="700" dy="34">╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝        ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0.65;0;0;0;0.85;0;0"
      dur="4s"
      repeatCount="indefinite"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 6 0; -5 0; 0 0"
      dur="0.22s"
      repeatCount="indefinite"
    />
  </g>

  <!-- HARU MAIN -->
  <g
    font-family="monospace"
    font-size="27"
    font-weight="900"
    fill="#f5f5f5"
    filter="url(#whiteGlow)"
  >
    <text
      x="700"
      y="190"
      text-anchor="middle"
      xml:space="preserve"
    >
      <tspan x="700" dy="0">██╗  ██╗ █████╗ ██████╗ ██╗   ██╗       ██████╗██╗  ██╗ █████╗ ███╗   ██╗</tspan>
      <tspan x="700" dy="34">██║  ██║██╔══██╗██╔══██╗██║   ██║      ██╔════╝██║  ██║██╔══██╗████╗  ██║</tspan>
      <tspan x="700" dy="34">███████║███████║██████╔╝██║   ██║█████╗██║     ███████║███████║██╔██╗ ██║</tspan>
      <tspan x="700" dy="34">██╔══██║██╔══██║██╔══██╗██║   ██║╚════╝██║     ██╔══██║██╔══██║██║╚██╗██║</tspan>
      <tspan x="700" dy="34">██║  ██║██║  ██║██║  ██║╚██████╔╝      ╚██████╗██║  ██║██║  ██║██║ ╚████║</tspan>
      <tspan x="700" dy="34">╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝        ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="1;1;0.92;1;1;0.96;1"
      dur="2.8s"
      repeatCount="indefinite"
    />
  </g>

  <!-- CLEAN DIVIDER -->
  <rect
    x="300"
    y="430"
    width="800"
    height="1"
    fill="url(#softLine)"
    opacity="0.22"
  >
    <animate
      attributeName="opacity"
      values="0.12;0.28;0.12"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- KAWAII RED GLITCH -->
  <g
    font-family="monospace"
    font-size="31"
    font-weight="900"
    fill="#ff003c"
    opacity="0"
    filter="url(#redGlow)"
  >
    <text
      x="700"
      y="495"
      text-anchor="middle"
      xml:space="preserve"
    >
      <tspan x="700" dy="0">██╗  ██╗ █████╗ ██╗    ██╗ █████╗ ██╗██╗</tspan>
      <tspan x="700" dy="37">██║ ██╔╝██╔══██╗██║    ██║██╔══██╗██║██║</tspan>
      <tspan x="700" dy="37">█████╔╝ ███████║██║ █╗ ██║███████║██║██║</tspan>
      <tspan x="700" dy="37">██╔═██╗ ██╔══██║██║███╗██║██╔══██║██║██║</tspan>
      <tspan x="700" dy="37">██║  ██╗██║  ██║╚███╔███╔╝██║  ██║██║██║</tspan>
      <tspan x="700" dy="37">╚═╝  ╚═╝╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝  ╚═╝╚═╝╚═╝</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0.8;0;0;0;0.7;0;0"
      dur="3.2s"
      repeatCount="indefinite"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; -7 0; 5 0; 0 0"
      dur="0.18s"
      repeatCount="indefinite"
    />
  </g>

  <!-- KAWAII MAIN -->
  <g
    font-family="monospace"
    font-size="31"
    font-weight="900"
    fill="#ffffff"
    filter="url(#whiteGlow)"
  >
    <text
      x="700"
      y="495"
      text-anchor="middle"
      xml:space="preserve"
    >
      <tspan x="700" dy="0">██╗  ██╗ █████╗ ██╗    ██╗ █████╗ ██╗██╗</tspan>
      <tspan x="700" dy="37">██║ ██╔╝██╔══██╗██║    ██║██╔══██╗██║██║</tspan>
      <tspan x="700" dy="37">█████╔╝ ███████║██║ █╗ ██║███████║██║██║</tspan>
      <tspan x="700" dy="37">██╔═██╗ ██╔══██║██║███╗██║██╔══██║██║██║</tspan>
      <tspan x="700" dy="37">██║  ██╗██║  ██║╚███╔███╔╝██║  ██║██║██║</tspan>
      <tspan x="700" dy="37">╚═╝  ╚═╝╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝  ╚═╝╚═╝╚═╝</tspan>
    </text>
  </g>

  <!-- MOVING SCANNER -->
  <rect
    x="0"
    y="-100"
    width="1400"
    height="80"
    fill="url(#redScan)"
    opacity="0.045"
  >
    <animate
      attributeName="y"
      values="-100;800"
      dur="4.5s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- RANDOM GLITCH BARS -->
  <g fill="#ff003c">
    <rect x="150" y="300" width="180" height="3">
      <animate
        attributeName="opacity"
        values="0;0;1;0;0;0"
        dur="2.8s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="x"
        values="150;900;150"
        dur="0.2s"
        repeatCount="indefinite"
      />
    </rect>

    <rect x="850" y="560" width="260" height="2">
      <animate
        attributeName="opacity"
        values="0;1;0;0;0"
        dur="3.7s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- SCANLINES -->
  <rect
    width="1400"
    height="720"
    fill="url(#scanlines)"
    pointer-events="none"
  />

  <!-- NOISE -->
  <rect
    width="1400"
    height="720"
    filter="url(#noise)"
    opacity="0.8"
    pointer-events="none"
  />

  <!-- CLEAN OUTER BORDER -->
  <rect
    x="20"
    y="20"
    width="1360"
    height="680"
    fill="none"
    stroke="#ffffff"
    stroke-width="1"
    opacity="0.08"
  />
</svg>
